version: '3.8'

services:
  # 1. Cơ sở dữ liệu quan hệ PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: ev_survey_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-ev_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecretSurvey2026}
      POSTGRES_DB: ${DB_NAME:-ev_survey_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ev_admin} -d ${DB_NAME:-ev_survey_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Máy phân tích R (Apollo, lavaan, BWS, Plumber API)
  analysis-api:
    build:
      context: .
      dockerfile: Dockerfile.r
    container_name: ev_analysis_r
    restart: always
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./analysis:/app/analysis
      - ./data:/app/data
    command: ["Rscript", "analysis/run_server.R"]

  # 3. Giao diện người dùng Web + Khảo sát + Quản trị + Phân tích (Next.js)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: ev_survey_web
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-ev_admin}:${DB_PASSWORD:-SecretSurvey2026}@db:5432/${DB_NAME:-ev_survey_db}
      - R_ANALYSIS_API_URL=http://analysis-api:8000
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-$2a$12$e8Y5tJtVnI0Z1w0qW3k5eO8J0x0y0z0w0}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_nckh_2026}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      analysis-api:
        condition: service_started

volumes:
  postgres_data:
